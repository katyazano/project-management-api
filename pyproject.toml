[tool.poetry]
name = "final"
version = "0.1.0"
description = ""
authors = [
    "katyazano <katheryn.azano@gmail.com>"
]
packages = []

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.140.7,<0.141.0"
uvicorn = {extras = ["standard"], version = ">=0.51.0,<0.52.0"}
pydantic = {extras = ["email"], version = ">=2.13.4,<3.0.0"}
pydantic-settings = ">=2.14.2,<3.0.0"
python-multipart = ">=0.0.32,<0.0.33"
sqlalchemy = ">=2.0.51,<3.0.0"
alembic = ">=1.18.5,<2.0.0"
asyncpg = ">=0.31.0,<0.32.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4,<2.0.0"}
boto3 = ">=1.43.57,<2.0.0"
pyjwt = ">=2.13.0,<3.0.0"
bcrypt = "4.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
black = ">=26.5.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
flake8 = ">=7.3.0,<8.0.0"
tox = ">=4.58.0,<5.0.0"
moto = ">=5.2.2,<6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"